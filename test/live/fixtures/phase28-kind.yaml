kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /var/tmp/amoebius-phase28-retained/mounts
    containerPath: /amoebius-retained
  - hostPath: /var/tmp/amoebius-phase28-audit
    containerPath: /var/log/kubernetes/audit
  - hostPath: /home/matthewnowak/amoebius/test/live/fixtures/phase28-audit-policy.yaml
    containerPath: /kind/phase28-audit-policy.yaml
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    extraArgs:
      - name: audit-log-maxsize
        value: '16'
      - name: audit-log-maxbackup
        value: '2'
      - name: audit-log-maxage
        value: '1'
      - name: audit-log-path
        value: /var/log/kubernetes/audit/audit.log
      - name: audit-policy-file
        value: /etc/kubernetes/audit-policy.yaml
    extraVolumes:
    - name: audit-policy
      hostPath: /kind/phase28-audit-policy.yaml
      mountPath: /etc/kubernetes/audit-policy.yaml
      readOnly: true
      pathType: File
    - name: audit-log
      hostPath: /var/log/kubernetes/audit
      mountPath: /var/log/kubernetes/audit
      pathType: DirectoryOrCreate
