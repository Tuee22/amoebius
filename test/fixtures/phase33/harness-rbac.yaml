apiVersion: v1
kind: ServiceAccount
metadata:
  name: phase33-harness
  namespace: phase33-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phase33-harness-bootstrap
  namespace: phase33-system
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["amoebius-control-plane"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["amoebius-control-plane"]
    verbs: ["get", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["amoebius-control-plane"]
    verbs: ["get", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: phase33-harness-observer
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phase33-harness-bootstrap
  namespace: phase33-system
subjects:
  - kind: ServiceAccount
    name: phase33-harness
    namespace: phase33-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phase33-harness-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: phase33-harness-observer
subjects:
  - kind: ServiceAccount
    name: phase33-harness
    namespace: phase33-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: phase33-harness-observer
