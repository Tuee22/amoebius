kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: 127.0.0.1
nodes:
- role: control-plane
  extraMounts:
  - hostPath: __RETAINED_MOUNTS__
    containerPath: /amoebius-retained
  - hostPath: __AMOEBIUS_BINARY__
    containerPath: /amoebius-test/bin/amoebius
    readOnly: true
