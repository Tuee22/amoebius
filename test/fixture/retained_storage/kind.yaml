kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: __AMOEBIUS_RETAINED_ROOT__/mounts/pg-witness
    containerPath: /amoebius-retained/pg-witness
  - hostPath: __AMOEBIUS_RETAINED_ROOT__/mounts/minio-witness
    containerPath: /amoebius-retained/minio-witness
  - hostPath: __AMOEBIUS_AUDIT_ROOT__
    containerPath: /var/log/kubernetes/audit
  - hostPath: __AMOEBIUS_AUDIT_POLICY__
    containerPath: /kind/retained-storage-audit-policy.yaml
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    extraArgs:
      - name: audit-log-maxsize
        value: '16'
      - name: audit-log-maxbackup
        value: '2'
      - name: audit-log-maxage
        value: '1'
      - name: audit-log-path
        value: /var/log/kubernetes/audit/audit.log
      - name: audit-policy-file
        value: /etc/kubernetes/audit-policy.yaml
    extraVolumes:
    - name: audit-policy
      hostPath: /kind/retained-storage-audit-policy.yaml
      mountPath: /etc/kubernetes/audit-policy.yaml
      readOnly: true
      pathType: File
    - name: audit-log
      hostPath: /var/log/kubernetes/audit
      mountPath: /var/log/kubernetes/audit
      pathType: DirectoryOrCreate
