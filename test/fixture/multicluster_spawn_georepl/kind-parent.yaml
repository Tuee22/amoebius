kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /var/run/docker.sock
        containerPath: /phase42/host/docker.sock
      - hostPath: /home/matthewnowak/.local/bin/kind
        containerPath: /phase42/bin/kind
        readOnly: true
      - hostPath: /usr/bin/docker
        containerPath: /phase42/bin/docker
        readOnly: true
      - hostPath: /home/matthewnowak/.pulumi/bin
