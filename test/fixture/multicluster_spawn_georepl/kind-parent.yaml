        readOnly: true
      - hostPath: /home/matthewnowak/amoebius/test/fixture/multicluster_spawn_georepl
        containerPath: /phase42/config
        readOnly: true
      - hostPath: /var/tmp/amoebius-multicluster-spawn-georepl-live
